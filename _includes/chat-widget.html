<button class="chat-launcher" id="chatLauncher" type="button" aria-label="Open portfolio chat" aria-expanded="false" aria-controls="chatPanel">
  <span class="launcher-mark" aria-hidden="true"></span><span>Ask the site</span>
</button>
<section class="chat-panel" id="chatPanel" role="dialog" aria-modal="false" aria-labelledby="chatTitle" hidden>
  <div class="chat-header">
    <div><h2 id="chatTitle">Ask the site</h2><p id="chatStatus">It answers from what's published on this page.</p></div>
    <div class="chat-header-actions">
      <button class="chat-clear" id="chatClear" type="button" aria-label="Start a new conversation">New chat</button>
      <button class="icon-button chat-close" id="chatClose" type="button" aria-label="Close chat">×</button>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages" aria-live="polite" aria-relevant="additions">
    <div class="chat-message assistant-message"><span class="message-label">Site</span><p>Hi. Ask me about Anant's projects, his stack or his background. If it isn't on this page, I'll say I don't know.</p></div>
  </div>
  <div class="chat-suggestions" id="chatSuggestions">
    <button type="button" data-chat-prompt="Walk me through AgentOS and its architecture.">How does AgentOS work?</button>
    <button type="button" data-chat-prompt="Why combine dense retrieval and BM25 in the hybrid RAG pipeline?">Why dense + BM25?</button>
    <button type="button" data-chat-prompt="What does Anant do at Tata Elxsi?">What does he do at work?</button>
  </div>
  <form class="chat-form" id="chatForm">
    <label class="visually-hidden" for="chatInput">Write a message</label>
    <textarea id="chatInput" rows="1" maxlength="1800" placeholder="Type a question" required></textarea>
    <button class="chat-send" id="chatSend" type="submit" aria-label="Send message"><span aria-hidden="true">↑</span></button>
  </form>
  <div class="chat-footer">Kimi K3.1 on Amazon Bedrock. Chat history stays in your browser; please don't paste anything sensitive.</div>
</section>
