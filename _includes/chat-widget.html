<div class="chat-backdrop" id="chatBackdrop" hidden></div>
<button class="chat-launcher" id="chatLauncher" type="button" aria-label="Open Ask AI" aria-expanded="false" aria-controls="chatPanel">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg>
  <span>Ask AI</span>
</button>
<section class="chat-panel scope-dark" id="chatPanel" role="dialog" aria-modal="false" aria-labelledby="chatTitle" hidden>
  <div class="chat-header">
    <img class="chat-avatar" src="{{ '/assets/profile.jpg' | relative_url }}?v=20261111" width="40" height="40" alt="">
    <div class="chat-head-text"><h2 id="chatTitle">Anant's assistant</h2><p id="chatStatus">Projects, skills &amp; experience</p></div>
    <div class="chat-header-actions">
      <button class="chat-clear" id="chatClear" type="button" aria-label="Start a new conversation">New chat</button>
      <button class="chat-close" id="chatClose" type="button" aria-label="Close chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages" aria-live="polite" aria-relevant="additions">
    <div class="chat-empty"><p>Get to know<br>Anant's work</p></div>
  </div>
  <div class="chat-suggestions" id="chatSuggestions">
    <button type="button" data-chat-prompt="Walk me through AgentOS and its architecture.">How does AgentOS work?</button>
    <button type="button" data-chat-prompt="Why combine dense retrieval and BM25 in the hybrid RAG pipeline?">Why dense + BM25?</button>
    <button type="button" data-chat-prompt="What does Anant do at Tata Elxsi?">What does he do at work?</button>
    <button type="button" data-chat-prompt="Is Anant open to new roles, and how do I reach him?">Is he open to roles?</button>
  </div>
  <form class="chat-form" id="chatForm">
    <label class="visually-hidden" for="chatInput">Write a message</label>
    <textarea id="chatInput" rows="1" maxlength="1800" placeholder="Ask about Anant" required></textarea>
    <button class="chat-send" id="chatSend" type="submit" aria-label="Send message"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 19V5"/></svg></button>
  </form>
  <p class="chat-disclaimer">It only knows what's on this site and can get things wrong</p>
</section>
