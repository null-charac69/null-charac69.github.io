<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="color-scheme" content="light dark">
  <script>
    // Resolve the theme before first paint (saved choice, else OS preference).
    (function () {
      try {
        var saved = localStorage.getItem("portfolio-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#101827");
        }
      } catch (e) {}
    })();
  </script>
  {% assign page_title = page.title | default: site.title %}
  {% assign page_description = page.description | default: site.description %}
  <title>{{ page_title | escape }}</title>
  <meta name="description" content="{{ page_description | escape }}">
  <meta name="author" content="Anant Kumar Thakur">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Anant Kumar Thakur">
  <meta property="og:title" content="{{ page_title | escape }}">
  <meta property="og:description" content="{{ page_description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ '/assets/og-card.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Anant Kumar Thakur — AI/ML Engineer">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title | escape }}">
  <meta name="twitter:description" content="{{ page_description | escape }}">
  <meta name="twitter:image" content="{{ '/assets/og-card.png' | absolute_url }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/Manrope-700.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/responsive.css' | relative_url }}">

</head>
