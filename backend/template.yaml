AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Amazon Bedrock chat API for Anant Kumar Thakur's portfolio.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://null-charac69.github.io
    Description: Exact browser origin allowed to call the public chat API.
  BedrockModelId:
    Type: String
    Default: apac.amazon.nova-lite-v1:0
    Description: Foundation model ID or Bedrock inference profile ID.

Globals:
  Function:
    Runtime: python3.12
    Handler: app.handler
    Timeout: 28
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        MAX_OUTPUT_TOKENS: "600"

Resources:
  PortfolioHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 8
        ThrottlingRateLimit: 3

  PortfolioChatExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeConfiguredBedrockModel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"

  PortfolioChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: anant-portfolio-api-chat
      CodeUri: src/
      Role: !GetAtt PortfolioChatExecutionRole.Arn
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortfolioHttpApi
            Path: /chat
            Method: POST
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortfolioHttpApi
            Path: /health
            Method: GET

  PortfolioChatLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/anant-portfolio-api-chat
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL for the portfolio chat API.
    Value: !Sub "https://${PortfolioHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ChatEndpoint:
    Description: POST endpoint used by the portfolio assistant.
    Value: !Sub "https://${PortfolioHttpApi}.execute-api.${AWS::Region}.amazonaws.com/chat"
  HealthEndpoint:
    Description: GET health endpoint.
    Value: !Sub "https://${PortfolioHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
