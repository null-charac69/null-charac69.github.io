name: Update public repository index

# Free on public repositories. Refreshes public-repos.json once a day; a
# commit to main triggers the normal GitHub Pages build.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_repos.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- public-repos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public-repos.json
            git commit -m "Update public repository index"
            git push
          fi
