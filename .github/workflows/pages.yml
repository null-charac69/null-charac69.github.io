name: Deploy portfolio

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "runtime-config.js"
      - "favicon.svg"
      - "assets/**"
      - "js/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble website artifact
        env:
          PORTFOLIO_API_URL: ${{ vars.PORTFOLIO_API_URL }}
        run: |
          mkdir -p _site/js _site/assets
          cp index.html styles.css favicon.svg _site/
          cp runtime-config.js _site/
          cp js/portfolio-data.js js/app.js js/chat.js _site/js/
          cp assets/profile.jpg _site/assets/
          printf 'window.PORTFOLIO_API_URL = "%s";\n' "$PORTFOLIO_API_URL" > _site/runtime-config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
