name: Deploy Bedrock chat API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/bedrock-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bedrock-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: \${{ vars.AWS_REGION || 'ap-southeast-2' }}
      BEDROCK_MODEL_ID: \${{ vars.BEDROCK_MODEL_ID || 'global.moonshotai.kimi-k3.1' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/src/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/src/requirements.txt

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend/src
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --template-file backend/template.yaml

      - name: Build Lambda package
        run: sam build --template-file backend/template.yaml --build-dir .aws-sam/build

      - name: Validate deployment credentials
        env:
          AWS_ACCESS_KEY_ID: \${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: \${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Missing repository secret AWS_ACCESS_KEY_ID."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Missing repository secret AWS_SECRET_ACCESS_KEY."; exit 1; }
          echo "AWS deployment secrets are present."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: \${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: \${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: \${{ env.AWS_REGION }}

      - name: Verify AWS identity and Bedrock model profile
        run: |
          aws sts get-caller-identity
          aws bedrock get-inference-profile \
            --inference-profile-identifier "$BEDROCK_MODEL_ID" \
            > /tmp/bedrock-profile.json
          python - <<'PY'
          import json
          with open("/tmp/bedrock-profile.json", encoding="utf-8") as profile_file:
              profile = json.load(profile_file)
          status = profile.get("status")
          if status != "ACTIVE":
              raise SystemExit(f"Bedrock inference profile is not ACTIVE: {status}")
          print("Bedrock inference profile:", profile.get("inferenceProfileName"))
          print("Bedrock profile status:", status)
          PY

      - name: Deploy API stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name anant-portfolio-api \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides AllowedOrigin=https://null-charac69.github.io BedrockModelId="$BEDROCK_MODEL_ID"

      - name: Verify API health and run live Bedrock chat test
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name anant-portfolio-api \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          echo "Testing API health endpoint..."
          HEALTH_RESPONSE=$(curl --fail --silent --show-error --max-time 10 "$API_URL/health")
          printf '%s' "$HEALTH_RESPONSE" | python -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result.get("status") == "ok", result
          assert result.get("provider") == "Amazon Bedrock", result
          print("Health check passed.")
          '

          echo "Testing live Bedrock chat endpoint..."
          CHAT_RESPONSE=$(curl --fail --silent --show-error --max-time 32 \
            -X POST "$API_URL/chat" \
            -H "Origin: https://null-charac69.github.io" \
            -H "Content-Type: application/json" \
            --data-binary '{"messages":[{"role":"user","content":"In one concise sentence, what does Anant’s AgentOS project do?"}]}')

          printf '%s' "$CHAT_RESPONSE" | python -c '
          import json, sys
          result = json.load(sys.stdin)
          reply = result.get("reply")
          if not isinstance(reply, str) or not reply.strip():
              raise SystemExit("Bedrock chat smoke test failed: no reply was returned.")
          print("Live Bedrock chat passed; response length:", len(reply), "characters.")
          '

          {
            echo "### Bedrock API deployment"
            echo ""
            echo "- Region: \`$AWS_REGION\`"
            echo "- Model profile: \`$BEDROCK_MODEL_ID\`"
            echo "- API base URL: \`$API_URL\`"
            echo "- Health check: passed"
            echo "- Live Bedrock chat: passed"
            echo ""
            echo "Add this base URL to \`portfolio_api_url\` in \`_config.yml\` and push to main to connect the public portfolio."
          } >> "$GITHUB_STEP_SUMMARY"
