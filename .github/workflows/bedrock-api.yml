name: Deploy Bedrock chat API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bedrock-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      BEDROCK_MODEL_ID: global.moonshotai.kimi-k3.1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm runner and AWS CLI
        run: |
          echo "Runner started successfully."
          aws --version
          python3 --version

      - name: Validate deployment configuration
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Missing repository secret AWS_ACCESS_KEY_ID."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Missing repository secret AWS_SECRET_ACCESS_KEY."; exit 1; }
          test -n "$AWS_REGION" || { echo "::error::AWS_REGION is empty."; exit 1; }
          test -n "$BEDROCK_MODEL_ID" || { echo "::error::BEDROCK_MODEL_ID is empty."; exit 1; }
          echo "Region: $AWS_REGION"
          echo "Bedrock model: $BEDROCK_MODEL_ID"
          echo "Both AWS repository secrets are present."

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/src/requirements.txt

      - name: Install backend and SAM dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/src/requirements.txt
          if ! command -v sam >/dev/null 2>&1; then
            python -m pip install aws-sam-cli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Run backend unit tests
        env:
          PYTHONPATH: backend/src
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Validate SAM template
        run: sam validate --template-file backend/template.yaml

      - name: Build Lambda package
        run: sam build --template-file backend/template.yaml --build-dir .aws-sam/build

      - name: Deploy API stack
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name anant-portfolio-api \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides AllowedOrigin=https://null-charac69.github.io BedrockModelId="$BEDROCK_MODEL_ID"

      - name: Verify API health and run live Bedrock chat test
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name anant-portfolio-api \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)

          echo "Testing API health endpoint..."
          HEALTH_RESPONSE=$(curl --fail --silent --show-error --max-time 10 "$API_URL/health")
          printf '%s' "$HEALTH_RESPONSE" | python -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result.get("status") == "ok", result
          assert result.get("provider") == "Amazon Bedrock", result
          print("Health check passed.")
          '

          echo "Testing live Bedrock chat endpoint..."
          CHAT_RESPONSE=$(curl --fail --silent --show-error --max-time 32 \
            -X POST "$API_URL/chat" \
            -H "Origin: https://null-charac69.github.io" \
            -H "Content-Type: application/json" \
            --data-binary '{"messages":[{"role":"user","content":"In one concise sentence, what does Anant’s AgentOS project do?"}]}')

          printf '%s' "$CHAT_RESPONSE" | python -c '
          import json, sys
          result = json.load(sys.stdin)
          reply = result.get("reply")
          if not isinstance(reply, str) or not reply.strip():
              raise SystemExit("Bedrock chat smoke test failed: no reply was returned.")
          print("Live Bedrock chat passed; response length:", len(reply), "characters.")
          '

          {
            echo "### Bedrock API deployment"
            echo ""
            echo "- Region: \`$AWS_REGION\`"
            echo "- Model profile: \`$BEDROCK_MODEL_ID\`"
            echo "- API base URL: \`$API_URL\`"
            echo "- Health check: passed"
            echo "- Live Bedrock chat: passed"
            echo ""
            echo "Add this base URL to \`portfolio_api_url\` in \`_config.yml\` and push to main to connect the public portfolio."
          } >> "$GITHUB_STEP_SUMMARY"
