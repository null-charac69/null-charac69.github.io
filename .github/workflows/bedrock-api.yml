name: Deploy Bedrock chat API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/bedrock-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bedrock-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Set the AWS_ACCESS_KEY_ID repository secret."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Set the AWS_SECRET_ACCESS_KEY repository secret."; exit 1; }
          test -n "$AWS_REGION" || { echo "::error::Set the AWS_REGION repository variable."; exit 1; }
          test -n "$BEDROCK_MODEL_ID" || { echo "::error::Set the BEDROCK_MODEL_ID repository variable."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Build Lambda package
        run: sam build --template-file backend/template.yaml --build-dir .aws-sam/build

      - name: Deploy API stack
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name anant-portfolio-api \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides AllowedOrigin=https://null-charac69.github.io BedrockModelId="$BEDROCK_MODEL_ID"

      - name: Print API endpoints
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name anant-portfolio-api \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          CHAT_URL=$(aws cloudformation describe-stacks \
            --stack-name anant-portfolio-api \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ChatEndpoint'].OutputValue" \
            --output text)
          echo "Portfolio API: $API_URL"
          echo "Chat endpoint: $CHAT_URL"
          {
            echo "### Bedrock API deployment"
            echo ""
            echo "- Base URL: \`$API_URL\`"
            echo "- Chat endpoint: \`$CHAT_URL\`"
            echo ""
            echo "Set portfolio_api_url in _config.yml to the base URL, commit, and push to update GitHub Pages."
          } >> "$GITHUB_STEP_SUMMARY"
